name: ScanPack Security Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  scan:
    name: Scan Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build ScanPack
        run: npm run build

      - name: Run ScanPack
        id: scanpack
        run: |
          node dist/cli.js --ci --json > scanpack-report.json || true
        continue-on-error: true

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanpack-report
          path: scanpack-report.json
          retention-days: 30

      - name: Check for malicious packages
        run: |
          if [ -f scanpack-report.json ]; then
            MALICIOUS=$(jq -r '.maliciousDependencies' scanpack-report.json)
            if [ "$MALICIOUS" -gt 0 ]; then
              echo "❌ Found $MALICIOUS malicious dependencies!"
              jq '.results[] | select(.isKnownMalicious == true or .isSecurityHolding == true)' scanpack-report.json
              exit 1
            fi
          fi

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('scanpack-report.json')) {
              const report = JSON.parse(fs.readFileSync('scanpack-report.json', 'utf8'));
              const body = `## 🔒 ScanPack Security Report
              
              **Total Dependencies:** ${report.totalDependencies}
              **✅ Valid:** ${report.validDependencies}
              **❌ Invalid:** ${report.invalidDependencies}
              **⚠️ Malicious:** ${report.maliciousDependencies}
              **❓ Unknown:** ${report.unknownDependencies}
              
              ${report.maliciousDependencies > 0 ? '⚠️ **Action Required:** Malicious dependencies detected!' : '✅ All dependencies are safe.'}
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

